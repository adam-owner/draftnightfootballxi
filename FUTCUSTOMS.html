function sg0(M){const o={};M.sc.forEach(n=>o[n]=(o[n]||0)+1);return Object.fromEntries(Object.entries(o).sort((a,b)=>b[1]-a[1]))}
const DCS=[{n:'Legends night',p:'icn',t:'Win a match using only legends.',r:150},{n:'Premier League night',p:'pl',t:'Win a match using Premier League players.',r:120},{n:'Champions League night',p:'now',t:'Win a match using this year’s players.',r:120}];
const OB=[['Play 3 matches','p',3,100],['Win 2 matches','w',2,150],['Score 5 goals','g',5,120],['Draft 3 legend cards','lg',3,80],['Open 2 packs','pk',2,200]];
function reward(g,wn){const w=wn==0,d=wn<0,c=G.career?(w?150:d?60:25)+g[0]*10:(w?60:d?25:10)+g[0]*5,x=w?120:d?60:40,l0=lvl();S.coins+=c;S.xp+=x;S.p++;S.wk.p++;S.wk.g+=g[0];
if(w){if(G.career&&S.cr)S.cr.w++;S.w++;S.wk.w++;S.st++;S.best=Math.max(S.best,S.st);if(G.daily)S.dc.done=1}else{S.st=0;d?S.d++:S.l++}
S.hist.unshift({r:w?'W':d?'D':'L',s:g[0]+'-'+g[1],f:G.pl[0].f});S.gf=(S.gf||0)+g[0];S.ga=(S.ga||0)+g[1];S.ff=S.ff||{};S.ff[G.pl[0].f]=(S.ff[G.pl[0].f]||0)+1;S.hist=S.hist.slice(0,15);sv();return{c,x,l:lvl()>l0}}
function hub(){clean();const D=DCS[dayN()%3];$('app').innerHTML=NV('hub')+`<div class="hero"><div class="lg">FUT<br>CUSTOMS</div><p>Spin clubs. Draft your XI. Rule the pitch.</p><button class="go" onclick="play()">Play now</button><button class="go" style="background:#fff;color:#10231c;margin-left:8px" onclick="career()">Career mode</button></div>
<div class="card"><div class="row"><b>${S.av||'⚽'} ${S.name||'Manager'} · Level ${lvl()}</b><span class="sm">${S.coins} coins · ${S.xp%200}/200 XP</span></div><div class="bar" style="margin:8px 0"><i style="width:${S.xp%200/2}%"></i></div><span class="sm">${S.p} played · ${S.w}W ${S.d}D ${S.l}L</span></div>
<div class="card"><b>Daily challenge: ${D.n}</b><p>${D.t} Resets in <span id="cd"></span>.</p><button ${S.dc.cl?'disabled':''} onclick="daily()">${S.dc.cl?'Claimed':S.dc.done?'Claim '+D.r+' coins':'Play ('+D.r+' coins)'}</button></div>
<h2>Weekly objectives</h2>${OB.map(o=>{const v=Math.min(S.wk[o[1]],o[2]),c=S.wk.c[o[1]];return`<div class="card"><div class="row"><span>${o[0]}</span><button style="width:auto;padding:6px 12px" ${v<o[2]||c?'disabled':''} onclick="claim('${o[1]}')">${c?'Claimed':v<o[2]?v+'/'+o[2]:'Claim '+o[3]}</button></div><div class="bar" style="margin-top:8px"><i style="width:${v/o[2]*100}%"></i></div></div>`}).join('')}`;
const u=()=>{const e=$('cd');if(!e)return;const s=Math.floor((864e5-Date.now()%864e5)/1e3);e.textContent=[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')};u();G.cd=setInterval(u,1000)}
function daily(){const D=DCS[dayN()%3];if(S.dc.done){S.coins+=D.r;S.dc.cl=1;sv();return hub()}clean();G={mode:'ai',pool:D.p,d:5,daily:1};start()}
function claim(k){const o=OB.find(x=>x[1]==k);if(S.wk[k]>=o[2]&&!S.wk.c[k]){S.wk.c[k]=1;S.coins+=o[3];sv()}hub()}
function coll(){clean();const f=G.cf=G.cf||{c:'',p:'',r:''},cl=[...new Set(P.map(x=>x.t))];const L=P.filter(x=>!x.dp&&(!f.c||x.t==f.c)&&(!f.p||x.p==f.p)&&(f.r===''||rar(x)==f.r)).sort((a,b)=>b.r-a.r);
$('app').innerHTML=NV('coll')+`<h1>Collection</h1><p>${S.disc.length} of ${P.length} discovered by drafting them.</p><div class="bar"><i style="width:${S.disc.length/P.length*100}%"></i></div>
<div class="row" style="margin:10px 0"><select onchange="G.cf.c=this.value;coll()"><option value="">All clubs</option>${cl.map(c=>`<option value="${c}" ${f.c==c?'selected':''}>${CN[c]}</option>`).join('')}</select><select onchange="G.cf.p=this.value;coll()"><option value="">All positions</option>${['G','D','M','F'].map(p=>`<option value="${p}" ${f.p==p?'selected':''}>${PN[p]}</option>`).join('')}</select><select onchange="G.cf.r=this.value;coll()"><option value="">All rarities</option>${RN.map((n,i)=>`<option value="${i}" ${f.r!==''&&f.r==i?'selected':''}>${n}</option>`).join('')}</select></div>
<div class="pk">${L.map(x=>{const d=S.disc.includes(x.n);return`<div class="card rc r${rar(x)}" style="margin:0;opacity:${d?1:.55}"><div class="row"><b>${d?x.n:'Undiscovered'}</b><b style="color:var(--hi);font-size:22px">${d?x.r:'?'}</b></div><span class="sm">${RN[rar(x)]} · ${CN[x.t]} · ${x.d}</span></div>`}).join('')}</div>`}
function car(){clean();const A=[['First victory',S.w>=1],['Winning streak of 3',S.best>=3],['Legendary squad (3 legends)',S.leg],['Veteran (10 matches)',S.p>=10],['Tournament champion',S.tr>0]];
$('app').innerHTML=NV('car')+`<h1>Career</h1><div class="card"><div class="row"><b>Level ${lvl()}</b><span class="sm">${S.xp} XP</span></div><p>${S.p} played · ${S.w}W ${S.d}D ${S.l}L · best streak ${S.best} · ${S.tr||0} trophies</p><p class="sm">Goals ${S.gf||0} for, ${S.ga||0} against · win rate ${S.p?Math.round(S.w/S.p*100):0}% · favourite formation ${Object.entries(S.ff||{}).sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]||'none yet'}</p></div><h2>Achievements</h2>${A.map(a=>`<div class="card row"><span>${a[0]}</span><b style="color:${a[1]?'var(--hi)':'var(--mut)'}">${a[1]?'Unlocked':'Locked'}</b></div>`).join('')}<h2>Match history</h2>${S.hist.map(h=>`<div class="card row"><b>${h.r}</b><span>${h.s}</span><span class="sm">${h.f}</span></div>`).join('')||'<p>No matches yet.</p>'}`}
function th(v){S.th=v;setTh();sv();sets()}
function rs(b){if(b.dataset.c){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}else{b.dataset.c=1;b.textContent='Tap again to confirm'}}
function sets(){clean();$('app').innerHTML=NV('sets')+`<h1>Settings</h1><div class="card"><b>Manager</b><input value="${S.name||''}" placeholder="Username" maxlength="14" oninput="S.name=this.value;sv()" style="margin:8px 0"><div class="seg">${['⚽','🧤','🏆','🦁','🔥','👑'].map(a=>`<button class="${S.av==a?'on':''}" onclick="S.av='${a}';sv();sets()">${a}</button>`).join('')}</div></div><div class="card"><b>Theme</b><div class="seg" style="margin-top:6px">${[['light','Light'],['dark','Dark'],['auto','Auto']].map(([k,l])=>`<button class="${(S.th||'dark')==k?'on':''}" onclick="th('${k}')">${l}</button>`).join('')}</div></div>
<div class="card"><div class="row"><b>Sound</b><button style="width:auto" onclick="S.mute=mute=mute?0:1;sv();sets()">${mute?'Off':'On'}</button></div><p class="sm" style="margin-top:8px">Volume</p><input type="range" min="0" max="100" value="${VOL*100}" oninput="VOL=S.vol=this.value/100;sv()"></div>
<div class="card"><p>Progress is saved in this browser only, not synced across devices.</p><button onclick="rs(this)">Reset progress</button></div>`}
function aiTeam(n){const f=pick(Object.keys(FM)),L=lay(f),xi=Array(11).fill(null);[...Array(11).keys()].sort(()=>R()-.5).forEach(i=>{const av=elig(L[i]);const b=av.sort(()=>R()-.5).slice(0,G.d).sort((a,c)=>c.r-a.r)[0];xi[i]=b;G.used.add(b.n)});return{n,f,xi,m:pick(MG)}}
function tourStart(){try{['Rovers FC','United FC'].forEach(n=>G.pl.push(aiTeam(n)))}catch(e){return err('Not enough players left for a tournament. Choose a bigger pool.')}G.T=G.pl.map(mkT);const M=newM(2,3,0);while(M.i<M.ticks.length)step(M);const a=M.T[0].g,b=M.T[1].g;G.tr={o:a==b?(R()<.5?2:3):a>b?2:3,st:1};playLive(0,1,1);G.M.tw=1}
function tourNext(wn){const t=G.tr;if(t.st==1){if(wn==0){t.st=2;playLive(0,t.o,1);G.M.tw=1;return}const M=newM(1,t.o,0);while(M.i<M.ticks.length)step(M);return tEnd(G.pl[M.T[0].g==M.T[1].g?(R()<.5?1:t.o):M.T[0].g>M.T[1].g?1:t.o].n)}
if(wn==0){S.tr=(S.tr||0)+1;sv();return tEnd(G.pl[0].n)}tEnd(G.pl[t.o].n)}
function tEnd(n){const me=n==G.pl[0].n;$('app').innerHTML=NV('hub')+`<h1>${me?'Champions!':'Tournament over'}</h1><p>${n} ${me?'won the tournament. Trophy added to your career.':'won the tournament.'}</p><button class="go" onclick="hub()">Home</button>`;if(me)confetti()}
function err(m){$('app').innerHTML=NV('play')+`<p style="color:var(--bad)">${m}</p><button class="go" onclick="play()">Back</button>`}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext('2d'),p=Array.from({length:120},()=>({x:R()*c.width,y:-R()*c.height/2,v:2+R()*4,s:4+R()*6,c:pick(['#f5c542','#3ddc97','#fff','#3b82f6'])}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.y+=q.v;q.x+=Math.sin(q.y/30);x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s)});if(++n<220)requestAnimationFrame(f);else c.remove()})()}
function qs(v){v=v.trim().toLowerCase();const o=$('sr');if(v.length<2){o.innerHTML='';return}const L=P.filter(x=>x.wc&&x.n.toLowerCase().includes(v)).slice(0,12);o.innerHTML=L.map(x=>`<div class="card rc r${rar(x)}" style="margin:6px 0"><div class="row"><b>${NT[x.t].f} ${x.n}</b><b style="font-size:22px">${x.r}</b></div><span class="sm">${RN[rar(x)]} · ${x.d} · ${x.club} · ${age(x)}y · ${x.h}cm · ${x.cp} caps, ${x.gl} goals</span><br><span class="sm">${attrs(x)} (estimated)</span></div>`).join('')||'<p>No match.</p>'}
function sqv(k){const s=SQ[k],q=trt(k);return`<p class="sm">Manager: ${MGR[k]} · ATT ${q.att} MID ${q.mid} DEF ${q.def} GK ${q.gk}</p>`+[...s].sort((a,b)=>b.r-a.r).map(x=>`<div class="row sm" style="padding:3px 0"><span><b style="color:var(--ink)">${x.n}</b> ${x.d} · ${x.club}</span><span>${age(x)}y ${x.h}cm ${x.cp}/${x.gl} <b style="color:var(--hi)">${x.r}</b></span></div>`).join('')}
function nat(){clean();const cf=G.nf||'';$('app').innerHTML=NV('nat')+`<h1>World Cup 2026</h1><p>${Object.keys(SQ).length} of 48 squads loaded from the official FIFA squad list (version 1, 19 July 2026). FUTCUSTOMS ratings are estimates, not official FIFA ratings.</p><input placeholder="Search players" oninput="qs(this.value)"><div id="sr"></div><div class="seg" style="margin:10px 0">${[['','All'],['UEFA','Europe'],['CAF','Africa'],['AFC','Asia'],['CONCACAF','N. America'],['CONMEBOL','S. America'],['OFC','Oceania']].map(([k,l])=>`<button class="${k==cf?'on':''}" onclick="G.nf='${k}';nat()">${l}</button>`).join('')}</div>${Object.entries(NT).filter(([k,v])=>!cf||v.c==cf).map(([k,v])=>`<div class="card" style="margin:6px 0"><div class="row" onclick="G.ne=G.ne=='${k}'?'':'${k}';nat()" style="cursor:pointer"><b>${v.f} ${v.n}</b><span class="sm">${v.c} · ${SQ[k]?SQ[k].length+' players':'squad not added yet'}</span></div>${G.ne==k&&SQ[k]?sqv(k):''}</div>`).join('')}`}
const PK=[{k:'c',n:'Common pack',cost:600,col:'#8a949e',d:'Base cards, up to 75 overall',pool:r=>r<=82},{k:'r',n:'Rare pack',cost:1500,col:'#14b8a6',d:'Solid cards, up to 80 overall',pool:r=>r>=76&&r<=88},{k:'e',n:'Epic pack',cost:3500,col:'#8b5cf6',d:'Stars rated 85 to 89',pool:r=>r>=85},{k:'l',n:'Legendary pack',cost:9000,col:'#f59e0b',d:'The best cards, 90 and above',pool:r=>r>=90}];
const CM=[['Win your first career match',1,200],['Win 3 career matches',3,500],['Win 5 career matches',5,1000],['Win 10 career matches',10,2500]];
let LC=0;function animN(to){const e=$('coins');if(!e)return;const f=LC;LC=to;let t0=null;const st=ts=>{t0=t0||ts;const p=Math.min(1,(ts-t0)/700);e.textContent=Math.round(f+(to-f)*p).toLocaleString();if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
function initCr(){const L=lay('4-3-3'),used=new Set,cards=[];let id=1;const xi=L.map(s=>{const x=pick(P.filter(x=>!x.dp&&COMP[s.d].includes(x.d)&&x.r<=84&&!used.has(x.n)));used.add(x.n);cards.push({id,k:x.n+'|'+x.c+'|'+x.t,er:Math.min(x.r,66+(R()*10|0))});return id++});S.cr={cards,sq:{f:'4-3-3',xi},w:0,nid:id,m:{}};sv()}
const cd=id=>S.cr.cards.find(c=>c.id==id),ccard=(c,fn)=>{const x=PM[c.k],t=rar({r:c.er});return`<button class="rc r${t}" onclick="${fn}"><span><b>${x.n}</b><br><span class="sm">${RN[t]} · ${x.d} · ${CN[x.t]}${x.club?' · '+x.club:''}</span></span><span class="r">${c.er}</span></button>`};
const unm=C=>new Set(C.sq.xi.filter(i=>i).map(i=>PM[cd(i).k].n));
function career(tab){clean();setTh('dark');if(!S.cr)initCr();const C=S.cr;if(tab)G.ct=tab;const T=G.ct||'sq';G.career=1;let b='';
if(T=='sq'){const L=lay(C.sq.f),un=unm(C);b=`<div class="seg">${Object.keys(FM).map(f=>`<button class="${f==C.sq.f?'on':''}" onclick="cf('${f}')">${f}</button>`).join('')}</div><div class="pitch" style="margin-top:10px"><i class="bx"></i><i class="bx tp"></i>${L.map((s,i)=>{const c=C.sq.xi[i]&&cd(C.sq.xi[i]),x=c&&PM[c.k];return`<button class="sl p${s.p} ${x?'on':''} ${G.cs===i?'sel':''}" style="left:${s.x}%;top:${s.y}%" onclick="csl(${i})">${x?`<b>${c.er}</b><small>${x.n.split(' ').pop().slice(0,9)}</small>`:s.d}</button>`}).join('')}</div><button class="go" style="background:var(--blue);color:#fff" onclick="auto()">Auto-fill best XI</button>`;
if(G.cs!=null){const s=L[G.cs],a=C.cards.filter(c=>COMP[s.d].includes(PM[c.k].d)&&(c.id==C.sq.xi[G.cs]||!un.has(PM[c.k].n))).sort((a,c)=>c.er-a.er);b+=`<h2>Choose your ${DN[s.d]}</h2><div class="pk">${a.map(c=>ccard(c,`place(${c.id})`)).join('')||'<p>No eligible cards. Open some packs.</p>'}</div>${C.sq.xi[G.cs]?'<button style="margin-top:8px" onclick="rmv()">Remove from squad</button>':''}`}
b+=`<p class="sm" style="margin-top:12px">${C.cards.length} cards owned</p>`}
if(T=='pk'){if(G.po){b+=`<h2>You got</h2><div class="pk">${G.po.map((c,i)=>`<div class="flip" style="animation-delay:${i*.35}s">${ccard(c,'void(0)')}</div>`).join('')}</div>`;G.po=null}
b+=`<h2>Pack store</h2><p>Each pack holds 3 cards. Common cards top out at 75, Rare at 80, Epic is 85 to 89, Legendary is 90 and up.</p><div class="pk">${PK.map(p=>`<div class="card pack" style="--pc:${p.col}"><div class="row"><b style="font-size:20px">${p.n}</b><b style="color:${p.col}">${p.cost.toLocaleString()} coins</b></div><p class="sm">${p.d}</p><button class="go" style="margin-top:4px;background:${p.col};color:#fff" ${S.coins<p.cost?'disabled':''} onclick="buy('${p.k}')">${S.coins<p.cost?'Not enough coins':'Buy and open'}</button></div>`).join('')}</div>`}
if(T=='qu'){b=`<h2>Weekly quests</h2>${OB.map(o=>{const v=Math.min(S.wk[o[1]],o[2]),c=S.wk.c[o[1]];return`<div class="card"><div class="row"><span>${o[0]}</span><button style="width:auto;padding:6px 12px" ${v<o[2]||c?'disabled':''} onclick="cclaim('${o[1]}')">${c?'Claimed':v<o[2]?v+'/'+o[2]:'Claim '+o[3]}</button></div><div class="bar" style="margin-top:8px"><i style="width:${v/o[2]*100}%"></i></div></div>`}).join('')}<h2>Career milestones</h2>${CM.map((o,i)=>{const v=Math.min(C.w,o[1]),c=C.m[i];return`<div class="card"><div class="row"><span>${o[0]}</span><button style="width:auto;padding:6px 12px" ${v<o[1]||c?'disabled':''} onclick="cm(${i})">${c?'Claimed':v<o[1]?v+'/'+o[1]:'Claim '+o[2]}</button></div><div class="bar" style="margin-top:8px"><i style="width:${v/o[1]*100}%"></i></div></div>`}).join('')}`}
if(T=='pl'){const cap=Math.min(99,72+C.w*2),ok=C.sq.xi.every(x=>x);b=`<div class="card"><b>Next opponent</b><p>Strength about ${cap} overall. It grows by 2 for every career win (you have ${C.w}). Winning pays 150 coins plus 10 per goal.</p><p class="sm">Your squad: ${C.sq.f}, ${C.sq.xi.filter(x=>x).length}/11 filled</p><button class="go" ${ok?'':'disabled'} onclick="cplay()">${ok?'Kick off':'Fill your squad first'}</button></div>`}
$('app').innerHTML=NV('career')+`<div class="row"><h1>Career</h1><div class="coinb"><span id="coins">0</span> coins</div></div><div class="seg" style="margin:10px 0">${[['sq','Squad'],['pk','Packs'],['qu','Quests'],['pl','Play']].map(([k,l])=>`<button class="${k==T?'on':''}" onclick="career('${k}')">${l}</button>`).join('')}</div>${b}`;animN(S.coins)}
function cf(f){const C=S.cr;C.sq.f=f;C.sq.xi=Array(11).fill(null);G.cs=null;sv();career()}
function csl(i){G.cs=G.cs===i?null:i;career()}
function place(id){S.cr.sq.xi[G.cs]=id;G.cs=null;snd('pick');sv();career()}
function rmv(){S.cr.sq.xi[G.cs]=null;G.cs=null;sv();career()}
function auto(){const C=S.cr,L=lay(C.sq.f),u=new Set;C.sq.xi=L.map(s=>{const a=C.cards.filter(c=>COMP[s.d].includes(PM[c.k].d)&&!u.has(PM[c.k].n)).sort((a,c)=>c.er-a.er)[0];if(a)u.add(PM[a.k].n);return a?a.id:null});G.cs=null;snd('pick');sv();career()}
function buy(k){const p=PK.find(x=>x.k==k),C=S.cr;if(S.coins<p.cost)return;S.coins-=p.cost;const a=P.filter(x=>!x.dp&&p.pool(x.r)),cs=[];for(let i=0;i<3;i++){const x=pick(a),er=k=='c'?Math.min(x.r,60+(R()*16|0)):k=='r'?Math.min(x.r,76+(R()*5|0)):k=='e'?Math.min(x.r,85+(R()*5|0)):x.r,c={id:C.nid++,k:x.n+'|'+x.c+'|'+x.t,er};C.cards.push(c);cs.push(c)}S.wk.pk++;sv();G.po=cs;snd(k=='l'?'roar':'pick');career('pk')}
function cclaim(k){const o=OB.find(x=>x[1]==k);if(S.wk[k]>=o[2]&&!S.wk.c[k]){S.wk.c[k]=1;S.coins+=o[3];sv();snd('roar')}career('qu')}
function cm(i){const C=S.cr;if(C.w>=CM[i][1]&&!C.m[i]){C.m[i]=1;S.coins+=CM[i][2];sv();snd('roar')}career('qu')}
function cplay(){const C=S.cr;if(C.sq.xi.some(x=>!x))return;const xi=C.sq.xi.map(i=>({...PM[cd(i).k],r:cd(i).er})),cap=Math.min(99,72+C.w*2);
G={mode:'ai',career:1,pool:'all',d:3,poolL:P.filter(x=>!x.dp),used:new Set(xi.map(x=>x.n)),ct:G.ct};const ai=aiTeam('AI');ai.xi=ai.xi.map(x=>({...x,r:Math.max(60,Math.min(x.r,cap-(R()*6|0)))}));
G.pl=[{n:'You',f:C.sq.f,xi,m:['Career coach',1,1,1]},ai];G.T=G.pl.map(mkT);playLive(0,1,1)}
function home(){hub()}
home();
</script></body></html>
