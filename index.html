if(T=='ann'){const r=await sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(20);b+=`<h2>News & announcements</h2><input id="at" placeholder="Title"><textarea id="ab" rows="4" placeholder="Text" style="width:100%;border-radius:12px;padding:10px;background:var(--card);color:var(--ink);border:1px solid var(--line)"></textarea><select id="ak"><option>update</option><option>dev</option><option>event</option></select><label class="sm"><input id="ap" type="checkbox" style="width:auto"> Pin</label><button class="go" onclick="postAnn()">Post</button>`+(r.data||[]).map(a=>`<div class="fx"><span class="sm" style="flex:1">${esc(a.title)}</span><button onclick="delAnn(${a.id})">Delete</button></div>`).join('')}
$('app').innerHTML=NV('adm')+`<h1>Owner dashboard</h1><div class="seg" style="margin:8px 0">${tabs.map(([k,l])=>`<button class="${k==T?'on':''}" onclick="adm('${k}')">${l}</button>`).join('')}</div>${b}`}
if(sb){sb.auth.onAuthStateChange(ev=>{setTimeout(async()=>{await loadMe();if(ev=='SIGNED_IN'||ev=='SIGNED_OUT')acct()},0)});(async()=>{await loadPublic();await loadMe();if(!G.M&&!G.pl&&!G.career)home()})()}

const IC={ball:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7l4 3-1.5 5h-5L8 10z" fill="currentColor"/>',cup:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM4 5h4M16 5h4M12 13v4M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',globe:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18" stroke="currentColor" stroke-width="2"/>',crown:'<path d="M3 8l5 4 4-7 4 7 5-4-2 11H5z" fill="currentColor"/>',vs:'<path d="M4 6l7 12M20 6l-7 12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',users:'<circle cx="9" cy="9" r="3" fill="currentColor"/><circle cx="17" cy="10" r="2.5" fill="currentColor"/><path d="M3 19c0-4 3-6 6-6s6 2 6 6M15 19c0-2 1-4 4-4" fill="none" stroke="currentColor" stroke-width="2"/>',home:'<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z" fill="currentColor"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',cards:'<rect x="5" y="3" width="11" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 7v13H9" fill="none" stroke="currentColor" stroke-width="2"/>',me:'<circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7" fill="currentColor"/>'};
const ic=(n,s)=>`<svg viewBox="0 0 24 24" width="${s||28}" height="${s||28}">${IC[n]}</svg>`;
const tabbar=a=>`<nav class="tabbar">${[['hub','Home','home'],['play','Play','play'],['career','Career','cup'],['coll','Cards','cards'],['acct','Me','me']].map(([f,l,i])=>`<button class="${f==a?'on':''}" onclick="${f}()">${ic(i,24)}<span>${l}</span></button>`).join('')}</nav>`;
const NV=a=>NV0(a)+tabbar(a);
function hud2(){const L=lvl(),xp=SRV?SRV.p.xp:S.xp,per=+(ECO.xp_per_level||200),pc=Math.min(100,(xp%per)/per*100);return`<div class="hud2"><div class="av">${SRV?esc(SRV.p.avatar):S.av||'⚽'}</div><div class="hi"><div class="row"><b>${esc(SRV?SRV.p.username:S.name||'Guest manager')}</b><span class="lv">LV ${L}</span></div><div class="xpb"><i style="width:${pc}%"></i></div><span class="sm">${S.p} played · ${S.w}W ${S.d}D ${S.l}L</span></div><div class="cn"><b>${Number(CO()).toLocaleString()}</b><span>coins</span></div>${ME||!sb?'':'<button class="sgn" onclick="acct()">Sign in</button>'}</div>`}
function qd(mode,pool){clean();G={mode,pool,d:5,np:3};start()}
function tiles(){const T=[['Quick Draft','Spin, pick, play','ball',"qd('ai','all')",'#2fe08a,#0b6b4a'],['Career','Packs, divisions, glory','cup',"career()",'#f5c542,#b8860b'],['World Cup','48 nations','globe',"qd('ai','wc')",'#3b82f6,#1e3a8a'],['Legends','Icons of the 90s and 2000s','crown',"qd('ai','icn')",'#ec4899,#831843'],['Tournament','Knockout glory','vs',"qd('tour','all')",'#f97316,#7c2d12'],['Local','2 to 10 players','users',"play()",'#8b5cf6,#4c1d95']];return`<div class="tiles">${T.map(([n,s,i,f,c])=>`<button class="tile" style="--tc:${c.split(',')[0]};--td:${c.split(',')[1]}" onclick="${f}">${ic(i,34)}<b>${n}</b><span>${s}</span></button>`).join('')}</div>`}
function home(){hub()}
home();
</script></body></html>
